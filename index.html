<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#b72c43"><title>MyTurn · Dein Lebenslauf</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="./" aria-label="MyTurn Start"><span class="brand-mark">m<span>↗</span></span><span>my<span class="brand-turn">turn</span><small>DEIN WEG. DEINE ZUKUNFT.</small></span></a><div class="workspace-label" data-t="workspace"></div><nav id="steps" aria-label="Lebenslauf Schritte"></nav><div class="sidebar-bottom"><div class="support-icon">♡</div><strong data-t="together"></strong><p data-t="support"></p><button class="text-button" id="help" data-t="help"></button><div class="project-note"><span class="awo">AWO <span>♡</span></span><span data-t="inspired"></span></div></div></aside>
<div class="app"><header><div class="breadcrumb"><span data-t="workspace"></span><span>/</span><strong data-t="create"></strong></div><div class="header-actions"><span id="account-email" class="account-email"></span><button id="open-login" class="text-button" data-t="login"></button><button id="logout" class="text-button" data-t="logout" hidden></button><label class="language"><span aria-hidden="true">◎</span><select id="language" aria-label="Sprache / Language"><option value="de">Deutsch</option><option value="en">English</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="fr">Français</option><option value="tr">Türkçe</option><option value="hi">हिन्दी</option></select></label></div></header>
<div id="save-banner" class="save-banner" role="status" aria-live="polite"><span id="save-state"></span><button id="retry-save" class="text-button" data-t="retry" hidden></button><button id="retry-load" class="text-button" data-t="loadRetry" hidden></button><button id="reload-saved" class="text-button" data-t="reload" hidden></button></div>
<section id="account-panel" class="account-panel" aria-labelledby="account-title">
<div class="account-art" aria-hidden="true"><span>m↗</span><div class="art-lines"></div><span class="art-heart">♡</span></div>
<div class="account-form-content"><div class="eyebrow" data-t="eyebrow"></div><h1 id="account-title" data-t="accountTitle"></h1><p class="account-intro" data-t="accountIntro"></p>
<div id="auth-tabs" class="auth-tabs"><button id="login-tab" type="button" data-t="login" aria-pressed="true"></button><button id="signup-tab" type="button" data-t="signup" aria-pressed="false"></button></div>
<form id="auth-form">
<div id="auth-name-field" class="field" hidden><label for="auth-name" data-t="name"></label><input id="auth-name" name="name" autocomplete="name" maxlength="120"></div>
<div id="auth-email-field" class="field"><label for="auth-email" data-t="accountEmail"></label><input id="auth-email" type="email" name="email" autocomplete="username" required maxlength="254"></div>
<div id="auth-password-field" class="field"><label for="auth-password" data-t="password"></label><input id="auth-password" type="password" name="password" autocomplete="current-password" required></div>
<p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
<button id="auth-submit" class="primary-button" type="submit" data-t="login"></button>
<button id="forgot-password" class="text-button" type="button" data-t="forgot"></button>
</form></div></section>
<main hidden><div class="intro"><div><div class="eyebrow"><span></span><span data-t="eyebrow"></span></div><h1 data-t="title"></h1><p data-t="subtitle"></p></div><button class="outline-button" id="preview-button"><span aria-hidden="true">▤</span><span data-t="preview"></span></button></div><div class="progress-top"><span id="step-count"></span><span id="percent"></span></div><div class="progress-track"><div id="progress"></div></div>
<div class="editor-layout"><section class="editor-card"><div class="section-heading"><div class="section-icon" id="section-icon"></div><div><h2 id="section-title"></h2><p id="section-subtitle"></p></div><span class="step-badge" id="step-badge"></span></div><form id="editor" novalidate></form><div class="form-bottom"><span><span class="lock-icon">♧</span> <span data-t="privacy"></span></span></div><div class="form-actions"><button id="back" class="back-button" data-t="back"></button><button id="next" class="primary-button"><span data-t="next"></span><span aria-hidden="true">→</span></button></div></section>
<aside class="preview-column"><div class="preview-heading"><span><i></i><span data-t="live"></span></span><span class="paper-size">A4</span></div><div class="paper-container"><article class="resume-paper" id="resume"></article><div class="paper-caption"><span aria-hidden="true">↻</span> <span data-t="automatic"></span></div></div><div class="tip-card"><span class="tip-icon">✧</span><div><strong data-t="tip"></strong><p id="tip-text"></p></div></div></aside></div><footer><span data-t="footer"></span><span class="footer-heart">♡ <span data-t="made"></span></span></footer></main></div>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Schließen / Close">×</button></div><div id="modal-body"></div><button id="print" class="primary-button" data-t="download"></button></dialog><script type="module" src="app.js"></script></body></html>
